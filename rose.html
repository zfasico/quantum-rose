<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05030a">
<title>Quantum Rose, to YuQi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #05030a;
    overscroll-behavior: none;
  }
  body {
    background: radial-gradient(115% 85% at 50% 46%, #170a16 0%, #0a0410 48%, #05030a 100%);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  canvas { display: block; }
  /* 坍缩瞬间的辉光脉冲 */
  #flash {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    mix-blend-mode: screen;
    background: radial-gradient(circle at 50% 46%,
      rgba(255, 110, 145, .8), rgba(255, 60, 100, .22) 40%, transparent 66%);
  }
  /* 献词落款 */
  .dedication {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(7% + env(safe-area-inset-bottom));
    z-index: 2;
    text-align: center;
    pointer-events: none;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(14px, 3.8vw, 19px);
    letter-spacing: .18em;
    color: rgba(255, 214, 224, .85);
    text-shadow:
      0 0 12px rgba(255, 80, 120, .55),
      0 0 34px rgba(255, 80, 120, .28);
    opacity: 0;
    animation: dedicationIn 3s ease 2.8s forwards;
  }
  @keyframes dedicationIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div id="flash"></div>
<div class="dedication">Dedicated to YuQi</div>
<noscript>需要启用 JavaScript 才能观看量子玫瑰。</noscript>

<script src="./lib/three.min.js"></script>
<script src="./lib/OrbitControls.js"></script>
<script src="./lib/CopyShader.js"></script>
<script src="./lib/LuminosityHighPassShader.js"></script>
<script src="./lib/EffectComposer.js"></script>
<script src="./lib/RenderPass.js"></script>
<script src="./lib/ShaderPass.js"></script>
<script src="./lib/MaskPass.js"></script>
<script src="./lib/UnrealBloomPass.js"></script>
<script>
'use strict';
/*
 * Quantum Rose · 量子玫瑰
 * 意象源自刘慈欣《球状闪电》：未被观察时处于概率云态，被观察时坍缩为实体。
 *
 * 形状来源：开源 3D 玫瑰模型（happy358 粒子玫瑰所用 red_rose3 模型），
 * 离线采样为带色点云并程序化补充长茎/茎刺/叶片（./lib/rose_points.json）。
 * 渲染：Three.js (MIT) + OrbitControls + UnrealBloom 辉光后处理；
 * 粒子采用柔光贴图，多层光晕叠加。
 *
 * 交互：
 *  - 按住屏幕：观察者效应，量子坍缩（波前自触点扩散）
 *  - 单指拖动：旋转视角（带惯性阻尼）
 *  - 双指捏合：缩放
 */
(function () {
  var TAU = Math.PI * 2;
  var rand = Math.random;

  var mobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i
    .test((navigator.userAgent || '').toLowerCase());

  /* ---------------- 柔光粒子贴图 ---------------- */
  function makeGlowTexture() {
    var c = document.createElement('canvas');
    c.width = c.height = 64;
    var g = c.getContext('2d');
    var grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.34, 'rgba(255,255,255,.95)');
    grd.addColorStop(0.62, 'rgba(255,255,255,.32)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, 64, 64);
    var tx = new THREE.CanvasTexture(c);
    tx.needsUpdate = true;
    return tx;
  }
  var glowTex = makeGlowTexture();

  /* ---------------- 基础场景 ---------------- */
  var scene = new THREE.Scene();

  var camera = new THREE.PerspectiveCamera(
    45, window.innerWidth / window.innerHeight, 0.1, 60);
  camera.position.set(0.7, 1.15, 3.3);

  var renderer = new THREE.WebGLRenderer({
    antialias: !mobile,
    alpha: false,
    preserveDrawingBuffer: true
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, mobile ? 1.6 : 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x07030c, 1);
  document.body.appendChild(renderer.domElement);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.38, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.enablePan = false;
  controls.minDistance = 1.1;
  controls.maxDistance = 7.5;
  controls.minPolarAngle = Math.PI * 0.08;
  controls.maxPolarAngle = Math.PI * 0.85;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.7;

  /* ---------------- 辉光后处理 ---------------- */
  var composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  var bloom = new THREE.UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    mobile ? 0.5 : 0.6,     /* strength */
    0.45,                    /* radius */
    0.35);                   /* threshold */
  composer.addPass(bloom);

  /* ---------------- 风摇组（玫瑰 + 微尘随微风轻摆） ---------------- */
  var windGroup = new THREE.Group();
  scene.add(windGroup);

  /* ---------------- 金尘 ---------------- */
  var DUST_N = mobile ? 80 : 150;
  var dustGeo = new THREE.BufferGeometry();
  var dustPos = new Float32Array(DUST_N * 3);
  var dustSeed = new Float32Array(DUST_N * 2);
  for (var d = 0; d < DUST_N; d++) {
    var da = rand() * TAU, dr = 0.45 + rand() * 1.5;
    dustPos[d * 3] = dr * Math.cos(da);
    dustPos[d * 3 + 1] = -1.4 + rand() * 3.0;
    dustPos[d * 3 + 2] = dr * Math.sin(da);
    dustSeed[d * 2] = rand() * TAU;
    dustSeed[d * 2 + 1] = 0.05 + rand() * 0.16;
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
  var dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
    size: 0.016,
    map: glowTex,
    color: 0xffd9a0,
    transparent: true,
    opacity: 0.55,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
  }));
  windGroup.add(dust);

  /* ---------------- 观察者效应（量子坍缩） ---------------- */
  var observe = 0, observeTarget = 0;
  var raycaster = new THREE.Raycaster();
  var flowerC = new THREE.Vector3(0, 0.38, 0);
  var flashEl = document.getElementById('flash');

  function pointerToFlower(cx, cy) {
    var ndc = new THREE.Vector2(
      (cx / window.innerWidth) * 2 - 1,
      -(cy / window.innerHeight) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    var ro = raycaster.ray.origin, rd = raycaster.ray.direction;
    var s = Math.max(0, flowerC.clone().sub(ro).dot(rd));
    return ro.clone().addScaledVector(rd, s);
  }

  /* ---------------- 主循环 ---------------- */
  function easeInOutCubic(x) {
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }

  var clock = new THREE.Clock();
  var intro = 0;
  var rafId = 0;
  var running = false;

  function animate() {
    rafId = requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);
    var t = clock.elapsedTime;

    intro = Math.min(1, intro + dt / 3.0);
    var ie = easeInOutCubic(intro);

    /* 观察值向目标平滑趋近（坍缩快、退相干慢） */
    var rate = observeTarget > observe ? 3.2 : 1.5;
    observe += (observeTarget - observe) * Math.min(1, dt * rate);
    controls.autoRotateSpeed = 0.7 - observe * 0.55;
    controls.update();

    /* 微风轻摆 */
    windGroup.rotation.z = Math.sin(t * 0.26) * 0.022;
    windGroup.rotation.x = Math.sin(t * 0.19 + 1.3) * 0.013;

    var shellGlow = 0;
    var sizeBase = mobile ? 0.034 : 0.030;
    var volBase = mobile ? 0.062 : 0.054;
    var cloud = 1 - observe;                 /* 1 = 概率云态，0 = 坍缩实体 */
    /* 位移：常态大幅涨落，坍缩时锐化收敛 */
    var shrink = 1 - 0.30 * observe;
    rose.material.size = sizeBase * shrink * (1 + 0.10 * cloud * Math.sin(t * 1.1));
    roseVol.material.size = volBase * (1 + 0.40 * cloud);
    /* 明暗：常态虚淡，坍缩凝实 */
    rose.material.opacity = 0.60 + 0.40 * observe;
    roseVol.material.opacity = 0.22 - 0.12 * observe;
    /* 色彩：常态褪色如幽灵（绿色通道多保留，茎叶可辨），坍缩还原鲜红 */
    rose.material.color.setRGB(
      0.72 + 0.28 * observe,
      0.85 + 0.15 * observe,
      0.70 + 0.30 * observe);
    roseVol.material.color.copy(rose.material.color);
    /* 辉光：常态飘渺，坍缩克制 */
    bloom.strength = (mobile ? 0.62 : 0.72) - 0.18 * observe;

    for (var i = 0; i < LIVE; i++) {
      var i3 = i * 3;

      /* 坍缩波前：距离触点越远越迟坍缩 */
      var lp = clamp01((observe * 1.7 - delays[i]) / 0.9);
      var collapse = lp * lp * (3 - 2 * lp); /* smoothstep */

      /* 常态概率云大幅涨落（朦胧但花形可辨）；坍缩时完全锐化 */
      var amp = ampA[i] * (1 - 0.97 * collapse);
      var drift = 0.05 * (1 - collapse);
      var px = basePos[i3] + amp * Math.sin(t * nFreq[i3] + nPhase[i3])
        + drift * Math.sin(t * 0.37 + nPhase[i3] * 1.7);
      var py = basePos[i3 + 1] + amp * Math.sin(t * nFreq[i3 + 1] + nPhase[i3 + 1])
        + drift * Math.sin(t * 0.29 + nPhase[i3 + 1] * 2.3);
      var pz = basePos[i3 + 2] + amp * Math.sin(t * nFreq[i3 + 2] + nPhase[i3 + 2])
        + drift * Math.sin(t * 0.43 + nPhase[i3 + 2] * 1.3);

      /* 入场：量子壳层 → 玫瑰位形 */
      var li = clamp01(ie * 1.45 - rndA[i] * 0.45);
      var le = easeOutCubic(li);
      curPos[i3] = shellPos[i3] + (px - shellPos[i3]) * le;
      curPos[i3 + 1] = shellPos[i3 + 1] + (py - shellPos[i3 + 1]) * le;
      curPos[i3 + 2] = shellPos[i3 + 2] + (pz - shellPos[i3 + 2]) * le;

      if (collapse > shellGlow && li > 0.9) shellGlow = collapse;
    }
    geo.attributes.position.needsUpdate = true;

    /* 金尘缓浮 */
    for (d = 0; d < DUST_N; d++) {
      dustPos[d * 3 + 1] += dt * dustSeed[d * 2 + 1] * 0.35;
      if (dustPos[d * 3 + 1] > 1.9) dustPos[d * 3 + 1] = -1.4;
      dustPos[d * 3] += Math.sin(t * 0.5 + dustSeed[d * 2]) * dt * 0.02;
    }
    dustGeo.attributes.position.needsUpdate = true;
    dust.rotation.y = t * 0.05;

    /* 坍缩辉光 */
    flashEl.style.opacity = (shellGlow * 0.2 * (0.72 + 0.28 * Math.sin(t * 6)))
      .toFixed(3);

    composer.render();
  }

  function startLoop() {
    if (running || !rose) return;
    running = true;
    clock.getDelta();
    rafId = requestAnimationFrame(animate);
  }
  function stopLoop() {
    running = false;
    cancelAnimationFrame(rafId);
  }

  /* ---------------- 尺寸与生命周期 ---------------- */
  var resizeTimer = 0;
  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, mobile ? 1.6 : 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(onResize, 120);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopLoop();
    else startLoop();
  });

  /* ---------------- 加载玫瑰点云并构建粒子 ---------------- */
  var geo, rose, roseVol, LIVE = 0;
  var basePos, colArr, shellPos, nPhase, nFreq, ampA, rndA, delays, curPos;
  var TOTAL = 0;

  fetch('./lib/rose_points.json?v=3')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var meta = data.meta;
      TOTAL = meta.count;
      LIVE = TOTAL; /* 点云已随机打散，全量渲染保持结构完整 */

      basePos = new Float32Array(data.p);
      colArr = new Float32Array(data.c);
      curPos = new Float32Array(TOTAL * 3);
      shellPos = new Float32Array(TOTAL * 3);
      nPhase = new Float32Array(TOTAL * 3);
      nFreq = new Float32Array(TOTAL * 3);
      ampA = new Float32Array(TOTAL);
      rndA = new Float32Array(TOTAL);
      delays = new Float32Array(TOTAL);

      for (var i = 0; i < TOTAL; i++) {
        var i3 = i * 3;
        var th = rand() * TAU, ph = Math.acos(rand() * 2 - 1);
        var rad = 2.4 + rand() * 1.8;
        shellPos[i3] = rad * Math.sin(ph) * Math.cos(th);
        shellPos[i3 + 1] = rad * Math.cos(ph) * 0.7 + 0.3;
        shellPos[i3 + 2] = rad * Math.sin(ph) * Math.sin(th);
        nPhase[i3] = rand() * TAU;
        nPhase[i3 + 1] = rand() * TAU;
        nPhase[i3 + 2] = rand() * TAU;
        nFreq[i3] = 0.6 + rand() * 1.7;
        nFreq[i3 + 1] = 0.6 + rand() * 1.7;
        nFreq[i3 + 2] = 0.6 + rand() * 1.7;
        ampA[i] = 0.020 + rand() * 0.045;
        rndA[i] = rand();
      }

      geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(curPos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
      geo.setDrawRange(0, LIVE);

      /* 双层渲染：大光晕体积层让形体连成一片，亮核层给表面颗粒质感 */
      roseVol = new THREE.Points(geo, new THREE.PointsMaterial({
        size: mobile ? 0.062 : 0.054,
        map: glowTex,
        vertexColors: true,
        transparent: true,
        opacity: 0.16,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        sizeAttenuation: true
      }));
      rose = new THREE.Points(geo, new THREE.PointsMaterial({
        size: mobile ? 0.034 : 0.030,
        map: glowTex,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        sizeAttenuation: true
      }));
      windGroup.add(roseVol);
      windGroup.add(rose);

      /* 构图：自适应取景，保证整朵花入画，茎向下延伸出画面 */
      var fy = meta.flowerY || 0.38;
      var fx = meta.flowerX || 0;
      var fz = meta.flowerZ || 0;
      controls.target.set(fx, fy + 0.06, fz);
      var aspect = window.innerWidth / Math.max(1, window.innerHeight);
      var dist = Math.max(3.15, 2.35 / aspect) / (2 * Math.tan(Math.PI / 8));
      dist = Math.min(Math.max(dist, 2.6), 7);
      camera.position.set(fx + dist * 0.16, fy + 0.5 + dist * 0.12, dist);
      camera.lookAt(controls.target);
      flowerC.set(fx, fy, fz);

      /* 触摸交互绑定（点云就绪后） */
      renderer.domElement.addEventListener('pointerdown', function (e) {
        if (!rose) return;
        observeTarget = 1;
        var src = pointerToFlower(e.clientX, e.clientY);
        for (var i = 0; i < LIVE; i++) {
          var i3 = i * 3;
          var dx = basePos[i3] - src.x;
          var dy = basePos[i3 + 1] - src.y;
          var dz = basePos[i3 + 2] - src.z;
          delays[i] = Math.sqrt(dx * dx + dy * dy + dz * dz) * 0.38;
        }
        if (navigator.vibrate) {
          try { navigator.vibrate(10); } catch (err) {}
        }
      }, { passive: true });
      window.addEventListener('pointerup', function () { observeTarget = 0; });
      window.addEventListener('pointercancel', function () { observeTarget = 0; });

      onResize();
      startLoop();
    })
    .catch(function (err) {
      console.error('点云加载失败', err);
    });
})();
</script>
</body>
</html>
