<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05030a">
<title>Quantum Rose · 量子玫瑰</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(115% 85% at 50% 40%, #170a16 0%, #0a0410 48%, #05030a 100%);
    color: #ffd9e2;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
      "HarmonyOS Sans SC", "MiSans", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    font-size: clamp(22px, 6vw, 34px);
    font-weight: 200;
    letter-spacing: .3em;
    padding-left: .3em;
    text-shadow: 0 0 18px rgba(255, 70, 115, .8), 0 0 44px rgba(255, 70, 115, .4);
    animation: glow 3.2s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { opacity: .82; }
    50% { opacity: 1; }
  }
  p {
    font-size: 12px;
    letter-spacing: .25em;
    padding-left: .25em;
    color: rgba(255, 190, 208, .5);
    margin-bottom: 14px;
  }
  a {
    display: block;
    width: min(78vw, 320px);
    padding: 15px 0;
    text-align: center;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: .22em;
    padding-left: .22em;
    color: #ffd9e2;
    border: 1px solid rgba(255, 100, 140, .38);
    border-radius: 999px;
    background: rgba(255, 70, 110, .07);
    transition: background .25s ease, border-color .25s ease, transform .15s ease;
  }
  a:active { transform: scale(.97); }
  a:hover { background: rgba(255, 70, 110, .16); border-color: rgba(255, 120, 160, .7); }
  .heart-link { border-color: rgba(255, 100, 140, .26); color: rgba(255, 217, 226, .85); }
</style>
</head>
<body>
<h1>量子玫瑰</h1>
<p>QUANTUM ROSE</p>
<a href="./rose.html">进入玫瑰 · 按住屏幕观察坍缩</a>
<a class="heart-link" href="./heart.html">粒子心形 · 轻触有惊喜</a>
</body>
</html>
